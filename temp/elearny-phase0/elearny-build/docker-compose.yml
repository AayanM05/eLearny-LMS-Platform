services:
  postgres:
    image: postgres:16-alpine
    container_name: elearny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: elearny_db
      POSTGRES_USER: elearny_dev
      POSTGRES_PASSWORD: elearny_devdb_password
    ports:
      - "5432:5432"
    volumes:
      - elearny-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearny -d elearny_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elearny-postgres-data:
