spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/elearny_db
    username: elearny_dev
    password: elearny_devdb_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SMTP_USERNAME:}
    password: ${GMAIL_SMTP_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# App-specific settings, not Spring's own namespace — see EmailService/OtpService.
elearny:
  mail:
    from-address: ${GMAIL_SMTP_USERNAME:}
    from-name: eLearny
  otp:
    expiry-minutes: 10
    resend-cooldown-seconds: 60
  jwt:
    # DEV-ONLY fallback secret — never rely on this default outside local
    # dev. Set a real JWT_SECRET env var (at least 64 random characters)
    # before deploying anywhere real; deployment.md will document the
    # production value when Phase 10 sets up hosting.
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production-change-me-please-1234567890}
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  account-lockout:
    max-failed-attempts: 5
  frontend-base-url: http://localhost:3000
  r2:
    # DEV-ONLY empty defaults — see MediaService, which degrades gracefully
    # (a clear 503 error, not a crash) when these aren't set. Get these
    # values from the Cloudflare dashboard (R2 > Manage API Tokens) when
    # ready to test real uploads.
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:elearny-media}
    public-base-url: ${R2_PUBLIC_BASE_URL:}

logging:
  level:
    com.elearny: DEBUG
    org.hibernate.SQL: DEBUG
