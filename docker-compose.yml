version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: elearny-postgres
    environment:
      POSTGRES_DB: elearny_db
      POSTGRES_USER: elearny_user
      POSTGRES_PASSWORD: elearny_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
