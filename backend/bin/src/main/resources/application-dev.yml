# "dev" now means: a real MySQL server running locally on your machine (no Docker, no H2).
# Defaults assume the most common local MySQL setup (root user, no password, default port).
# If your local MySQL differs, either export the env vars below before starting the app, or
# just edit this file directly — both work.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:elearny_dev}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
