<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        body { font-family: 'Helvetica', sans-serif; text-align: center; padding: 60px; border: 10px solid #5b3fd6; }
        h1 { font-size: 40px; color: #5b3fd6; margin-bottom: 0; }
        .subtitle { font-size: 16px; color: #666; letter-spacing: 4px; text-transform: uppercase; }
        .student-name { font-size: 32px; margin: 30px 0; font-weight: bold; }
        .course-title { font-size: 22px; margin: 10px 0 30px 0; }
        .meta { font-size: 13px; color: #888; margin-top: 40px; }
        .code { font-family: monospace; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="subtitle">Certificate of Completion</div>
    <h1>eLearny</h1>
    <p>This certifies that</p>
    <div class="student-name" th:text="${studentName}">Student Name</div>
    <p>has successfully completed the course</p>
    <div class="course-title" th:text="${courseTitle}">Course Title</div>
    <p>Instructor: <span th:text="${instructorName}">Instructor Name</span></p>
    <div class="meta">
        Completion Date: <span th:text="${completionDate}">Date</span><br/>
        <div class="code">Verification Code: <span th:text="${certificateCode}">CODE</span></div>
    </div>
</body>
</html>
