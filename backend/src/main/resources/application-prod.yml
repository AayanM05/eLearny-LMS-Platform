spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${VERCEL_WEB_URL:http://localhost:3000}}

