server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: elearny-backend
  profiles:
    active: dev
  
  datasource:
    url: jdbc:postgresql://localhost:5432/elearny_db
    username: elearny_user
    password: elearny_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
